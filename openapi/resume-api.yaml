        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/hobbies/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getHobby
      tags: [Hobbies]
      summary: Get one hobby
      responses:
        "200":
          description: The hobby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hobby"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateHobby
      tags: [Hobbies]
      summary: Replace one hobby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HobbyInput"
      responses:
        "200":
          description: The updated hobby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hobby"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHobby
      tags: [Hobbies]
      summary: Delete one hobby
