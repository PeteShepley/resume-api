      tags: [Hobbies]
      summary: List hobbies (insertion order)
      responses:
        "200":
          description: Hobbies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hobby"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHobby
      tags: [Hobbies]
      summary: Create a hobby
      requestBody:
