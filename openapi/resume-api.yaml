        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSkill
      tags: [Skills]
      summary: Replace one skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "200":
          description: The updated skill.
          content:
