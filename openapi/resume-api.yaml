openapi: 3.0.3
info:
  title: Resume API
  version: "1.0.0"
  description: |
    An API for a person's resume-shaped data — profile, work experience,
    education, skills, certifications, hobbies, and goals — served back as
    JSON or Markdown.

    Every route is scoped to the caller's own identity: there is no person
    ID anywhere in a URL or request body. The caller's Clerk user is derived
    from the verified JWT on every request, so `/me/...` always means
    "the signed-in user," never anyone else's data.

    Authenticate with a Clerk session token, issued against the `resume-api`
    JWT template (audience `https://api.peteshepley.com`), sent as
    `Authorization: Bearer <token>`.
  contact:
    name: Pete Shepley
    url: https://peteshepley.com
  license:
    name: Source
    url: https://github.com/PeteShepley/resume-api

servers:
  - url: https://resume.api.peteshepley.com
    description: Production
  - url: https://cb1nkp4qvk.execute-api.us-east-1.amazonaws.com
    description: Production (default API Gateway invoke URL, no custom domain)
  - url: http://localhost:8000
    description: Local development (see README "Running locally")

security:
  - clerkAuth: []

tags:
  - name: Profile
    description: Singleton profile — one per person.
  - name: Experience
    description: Work experience, sorted most-recent-first.
  - name: Education
    description: Education history, sorted most-recent-first.
  - name: Skills
    description: Skills, in insertion order.
  - name: Certifications
    description: Certifications, in insertion order.
  - name: Hobbies
    description: Hobbies, in insertion order.
  - name: Goals
    description: Career/personal/learning goals, in insertion order.
  - name: Resume
    description: The whole resume assembled in one call.

paths:
  /me/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the caller's profile
      description: 404 until the first `PUT /me/profile`.
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putProfile
      tags: [Profile]
      summary: Create or replace the caller's profile
      description: Upsert — always succeeds, no 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The profile as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/experience:
    get:
      operationId: listExperience
      tags: [Experience]
      summary: List experience entries (most recent first)
      responses:
        "200":
          description: Experience entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperience
      tags: [Experience]
      summary: Create an experience entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "201":
          description: The created experience entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/experience/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getExperience
      tags: [Experience]
      summary: Get one experience entry
      responses:
        "200":
          description: The experience entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateExperience
      tags: [Experience]
      summary: Replace one experience entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "200":
          description: The updated experience entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteExperience
      tags: [Experience]
      summary: Delete one experience entry
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/education:
