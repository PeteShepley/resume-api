        "404":
          $ref: "#/components/responses/NotFound"

  /me/goals:
    get:
      operationId: listGoals
      tags: [Goals]
      summary: List goals (insertion order)
      responses:
        "200":
          description: Goals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGoal
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: The created goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/goals/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getGoal
      tags: [Goals]
      summary: Get one goal
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateGoal
      tags: [Goals]
      summary: Replace one goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: The updated goal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGoal
      tags: [Goals]
      summary: Delete one goal
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/resume:
    get:
      operationId: getResume
      tags: [Resume]
      summary: Get the whole resume in one call
      description: >-
        Assembles the profile plus all six collections in a single query.
        `format=markdown` returns a rendered Markdown resume instead of JSON.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        "200":
          description: The assembled resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Clerk session token issued against the `resume-api` JWT template
        (audience `https://api.peteshepley.com`). Verified by API Gateway's
        JWT authorizer before the request ever reaches the Lambda.

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The entry's `id` (uuid4), as returned by list/create.

  responses:
    BadRequest:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No entry exists for the caller with that id (or no profile yet).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string

    EmploymentType:
      type: string
      enum: [full-time, part-time, contract, internship, self-employed]
    SkillCategory:
      type: string
      enum: [language, framework, tool, soft-skill]
    Proficiency:
      type: string
      enum: [beginner, intermediate, advanced, expert]
    CertificationType:
      type: string
      enum: [professional, personal]
    GoalCategory:
      type: string
      enum: [career, personal, learning]
    GoalStatus:
      type: string
      enum: [active, achieved, abandoned]

    ItemMeta:
      type: object
      description: Fields DynamoDB-backed collection items carry in addition to their own data.
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
        pk:
          type: string
          description: Internal DynamoDB partition key (`USER#<clerk_user_id>`). Not needed by clients.
        sk:
          type: string
          description: Internal DynamoDB sort key (`<ENTITY_TYPE>#<id>`). Not needed by clients.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileMeta:
      type: object
      properties:
        entity_type:
          type: string
        pk:
          type: string
          description: Internal DynamoDB partition key (`USER#<clerk_user_id>`). Not needed by clients.
        sk:
          type: string
          description: Internal DynamoDB sort key (always `PROFILE`). Not needed by clients.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        headline:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        links:
          type: object
          additionalProperties:
            type: string
          description: 'e.g. `{"linkedin": "...", "github": "...", "site": "..."}`'
        goals_summary:
          type: string
          nullable: true
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - $ref: "#/components/schemas/ProfileMeta"

    ExperienceInput:
      type: object
      required: [organization, title, start_date]
      properties:
        organization:
          type: string
        title:
          type: string
        location:
          type: string
          nullable: true
        employment_type:
          $ref: "#/components/schemas/EmploymentType"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
          description: Omit/null for the current role.
        responsibilities:
          type: array
          items:
            type: string
        accomplishments:
          type: array
          items:
            type: string
    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceInput"
        - $ref: "#/components/schemas/ItemMeta"

    EducationInput:
      type: object
      required: [institution, degree, start_date]
      properties:
        institution:
          type: string
        degree:
          type: string
        field_of_study:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        gpa:
          type: string
          nullable: true
        honors:
          type: string
          nullable: true
        activities:
          type: string
          nullable: true
    Education:
      allOf:
        - $ref: "#/components/schemas/EducationInput"
        - $ref: "#/components/schemas/ItemMeta"

    SkillInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          $ref: "#/components/schemas/SkillCategory"
        proficiency:
          $ref: "#/components/schemas/Proficiency"
        years_experience:
          type: number
          nullable: true
    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillInput"
        - $ref: "#/components/schemas/ItemMeta"

    CertificationInput:
      type: object
      required: [name, issuing_organization, issue_date]
      properties:
        name:
          type: string
        issuing_organization:
          type: string
        issue_date:
          type: string
          format: date
        expiration_date:
          type: string
          format: date
          nullable: true
        credential_id:
          type: string
          nullable: true
        credential_url:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/CertificationType"
          default: professional
    Certification:
      allOf:
        - $ref: "#/components/schemas/CertificationInput"
        - $ref: "#/components/schemas/ItemMeta"

    HobbyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    Hobby:
      allOf:
        - $ref: "#/components/schemas/HobbyInput"
        - $ref: "#/components/schemas/ItemMeta"

    GoalInput:
      type: object
      required: [description, category]
      properties:
        description:
          type: string
        category:
          $ref: "#/components/schemas/GoalCategory"
        target_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/GoalStatus"
          default: active
    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - $ref: "#/components/schemas/ItemMeta"

    Resume:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        education:
          type: array
          items:
            $ref: "#/components/schemas/Education"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
        hobbies:
          type: array
          items:
            $ref: "#/components/schemas/Hobby"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
